---
apiVersion: authentik.starry.blue/v1alpha1
kind: AuthentikApplication
metadata:
  name: mealie
  namespace: default
spec:
  slug: mealie
  name: Mealie
  adopt: IfMatch
  deletionPolicy: Delete
  provider:
    name: Mealie
    flows:
      authorization:
        slug: default-provider-authorization-explicit-consent
      invalidation:
        slug: default-provider-invalidation-flow
      authentication:
        slug: authentication-flow
    oauth2:
      clientType: Public
      redirectURIs:
        - url: https://recipes.${S_HOMEPROD_DOMAIN}/login
        - url: https://recipes.${S_HOMEPROD_DOMAIN}/login?direct=1
      scopes:
        - scopeName: openid
        - scopeName: email
        - scopeName: profile
        - scopeName: offline_access
      grantTypes:
        - AuthorizationCode
        - Hybrid
        - Implicit
        - ClientCredentials
        - Password
        - DeviceCode
        - RefreshToken
      accessTokenValidity: minutes=5
      signingKey:
        name: authentik Self-signed Certificate
  access:
    public: true
    prune: true
