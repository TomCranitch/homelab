---
apiVersion: authentik.starry.blue/v1alpha1
kind: AuthentikApplication
metadata:
  name: karakeep
  namespace: default
spec:
  slug: karakeep
  name: Karakeep
  adopt: IfMatch
  deletionPolicy: Delete
  provider:
    name: Provider for Karakeep
    flows:
      authorization:
        slug: default-provider-authorization-explicit-consent
      invalidation:
        slug: default-provider-invalidation-flow
    oauth2:
      clientType: Confidential
      redirectURIs:
        - url: https://reader.${S_HOMEPROD_DOMAIN}/api/auth/callback/custom
      scopes:
        - scopeName: openid
        - scopeName: email
        - scopeName: profile
      credentials:
        secretRef:
          name: karakeep
          clientIDKey: OAUTH_CLIENT_ID
          clientSecretKey: OAUTH_CLIENT_SECRET
      grantTypes:
        - AuthorizationCode
        - Hybrid
        - Implicit
        - ClientCredentials
        - Password
        - DeviceCode
        - RefreshToken
      accessTokenValidity: minutes=5
      signingKey:
        name: authentik Self-signed Certificate
  access:
    public: true
    prune: true
