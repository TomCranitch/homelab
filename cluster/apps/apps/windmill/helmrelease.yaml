---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: windmill
  namespace: default
spec:
  interval: 15m
  chart:
    spec:
      chart: windmill
      version: 4.0.270
      sourceRef:
        kind: HelmRepository
        name: windmill-labs-charts
        namespace: flux-system
      interval: 15m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    windmill:
      baseDomain: &host "windmill.${S_HOMEPROD_DOMAIN}"
      baseProtocol: "https"
      databaseUrlSecretName: default-cluster-pguser-windmill
      databaseUrlSecretKey: uri
      appReplicas: 2
      app:
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: windmill-app
                    release: windmill
        resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 2056Mi
              cpu: 2000m
      workerGroups:
        - name: default
          replicas: 2
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app: windmill-workers
                      workerGroup: default
                      release: windmill
          podSecurityContext:
            runAsNonRoot: true
            runAsUser: ${CONTAINER_UID}
            runAsGroup: ${CONTAINER_GID}
          privileged: false
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1028Mi
              cpu: 1000m
      lspReplicas: 1
      multiplayerReplicas: 1
    postgresql:
      enabled: false
    httproute:
      enabled: true
      parentRefs:
        - name: envoy-gateway
          namespace: ingress
      appParentRefs:
        - name: envoy-gateway
          namespace: ingress
  # These chart deployments require a surge by default; replace one pod at a time.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: windmill-app
            patch: |-
              - op: replace
                path: /spec/strategy/rollingUpdate/maxSurge
                value: 0
              - op: replace
                path: /spec/strategy/rollingUpdate/maxUnavailable
                value: 1
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: windmill-workers-default
            patch: |-
              - op: replace
                path: /spec/strategy/rollingUpdate/maxSurge
                value: 0
              - op: replace
                path: /spec/strategy/rollingUpdate/maxUnavailable
                value: 1
