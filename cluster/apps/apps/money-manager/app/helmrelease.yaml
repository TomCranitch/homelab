# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: money-manager
  namespace: default
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
      interval: 15m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    defaultPodOptions:
      runtimeClassName: gvisor
      labels:
        networking.home.arpa/ingress-envoy: "true"
        networking.home.arpa/postgres-default-client: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: ${CONTAINER_UID}
        runAsGroup: ${CONTAINER_GID}
        fsGroup: ${CONTAINER_FSGROUP}
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      money-manager:
        defaultContainerOptions:
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        containers:
          app:
            image:
              repository: ghcr.io/tomcranitch/money-manager
              tag: main
            ports:
              - name: http
                containerPort: 3000
                protocol: TCP
            env:
              # The app has no login of its own; the envoy-oidc SecurityPolicy
              # in the default namespace protects this route.
              APP_PUBLIC_URL: https://money.${S_HOMEPROD_DOMAIN}
              REPORTING_CURRENCY: AUD
              LOG_LEVEL: info
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: ${POSTGRES_DEFAULT_SECRET_PREFIX}-money-manager
                    key: uri
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: http
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: http
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    service:
      app:
        controller: money-manager
        ports:
          http:
            port: 3000
    route:
      main:
        enabled: true
        kind: HTTPRoute
        hostnames:
          - "money.${S_HOMEPROD_DOMAIN}"
        parentRefs:
          - name: envoy-gateway
            namespace: ingress
    networkpolicies:
      app:
        type: cilium
        controller: money-manager
        description: Default-deny money-manager with Openfeed and exchange-rate egress
        egress:
          - toFQDNs:
              - matchName: auth.openfeed.au
              - matchName: api.openfeed.au
              - matchName: api.frankfurter.dev
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
        enableDefaultDeny:
          ingress: true
          egress: true
        log: money-manager
