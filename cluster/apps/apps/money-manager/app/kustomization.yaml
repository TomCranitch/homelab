---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - secret.sops.yaml
  - openfeed-keys.sops.yaml
  - plaid.sops.yaml
  - ghcr-pull.sops.yaml
  - helmrelease.yaml
configMapGenerator:
  - name: money-manager-workflows
    namespace: default
    files:
      - household.yaml=./household.yaml
    options:
      # Flux would substitute $ldgrp in the rules; leave the file as written.
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
generatorOptions:
  disableNameSuffixHash: true
