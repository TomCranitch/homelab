# Tom's household rules for the homelab money-manager (mounted in the
# WORKFLOWS_PATH folder). They run after the built-in files, so they add to
# them. From the 28 Oct 2026 export review.
version: 1
rules:
  # Own accounts the bank describes by first name only (needs name placeholders).
  - name: My HSBC, Revolut and other own accounts
    when:
      description:
        - /\bto {first_name} hsbc\b/ # Transfer To Tom Hsbc - Funds transfer
        - "{first_name} (*)" # Tom (HSBC Spending), Tom (Revolut)
        - ING Transactional
    set: { category: between_accounts }

  # Money from me via Wise into the US accounts.
  - name: Wise to my US accounts
    when: { description: WISE US INC, direction: in }
    set: { category: between_accounts }

  # Citi PayAll (Oct 2024 to Feb 2025): paying myself with the Citi card, then clearing the card.
  - name: Citi PayAll deposits
    when: { description: Citi Payall, direction: in }
    set: { category: between_accounts }
  - name: Citi card payments
    when: { description: "/citibank credit ?c/", direction: out }
    set: { category: card_repayments }

  # Saving, not spending.
  - name: Brokers
    when:
      account_kind: bank
      description: /\b(webull|stake|stakeshop)\b/
    set: { category: investments }
  - name: Voluntary super
    when: { account_kind: bank, direction: out, description: /\bunisuper\b/ }
    set: { category: retirement_contributions }
  - name: Morgan Stanley share sale cash
    when: { account_kind: bank, direction: in, description: /\bmorgan stanley\b/ }
    set: { category: investment_transfers }

  # Housemate's share of the rent offsets the rent (a reimbursement later).
  - name: Housemate rent share
    when: { description: $ldgrp, direction: in, amount: { min: 1000, max: 1100 } }
    set: { category: rent }

  # Two fortnights paid at once (4 times so far: 2,100 to 2,120). Only double the single range.
  - name: Housemate rent share, two fortnights
    when: { description: $ldgrp, direction: in, amount: { min: 2000, max: 2200 } }
    set: { category: rent }

  # Repayments to cards the app can't see (29 Oct 2026 review). Counted as transfers, so those
  # cards' purchases don't show anywhere (Tom's call, 30 Oct 2026).
  - name: Unconnected card repayments
    when:
      account_kind: bank
      direction: out
      description:
        - /\b(anz|commonwealth|westpac|nab|mycard credit) cards\b/ # BPAY "Anz Cards", "Payment to nab cards - CRN ..."
        - Suncorp Bank Cov
        - Virgin Money
        - HSBC AUTOPAYMENT* # HSBC US, from SoFi
        - AMEX EPAYMENT* # Amex US, from SoFi
    set: { category: card_repayments }

  # Rent through Deft (BPAY and Macquarie's "Payment to DEFT REAL ESTATE") and Rental Rewards.
  - name: Rent
    when: { direction: out, description: [/\bdeft (rent|real estate)\b/, Rental Rewards] }
    set: { category: rent }

  - name: Tax
    when: { direction: out, description: [/\btax office payments\b/] }
    set: { category: tax }

  # Macquarie sends its own codes, not real MCCs: 0022 for ATM withdrawals, 0230 for ATM fees.
  - name: Cash (Macquarie and Up)
    when:
      direction: out
      description: ["Withdrawal at *", "*ATM Cash Out", Bank@Post Withdrawal]
    set: { category: cash }
  - name: Macquarie cash code
    when: { mcc: "0022", direction: out }
    set: { category: cash }
  - name: Macquarie ATM fee code
    when: { mcc: "0230" }
    set: { category: bank_fees }

  # More of my own accounts and wallets. YouTrip is a travel card topped up from the Qantas card.
  - name: Other own accounts and wallets
    when:
      description:
        - "Me (*)" # Up payee, e.g. Me (Westpac)
        - Ubank Saver
        - "YOUTRIP *"
        - "To Wise Australia*"
    set: { category: between_accounts }

  - name: AGL
    when: { merchant: AGL }
    set: { category: electricity_and_gas }
  - name: Bupa
    when: { merchant: "Bupa*" }
    set: { category: health_insurance }
  - name: Buy now pay later
    when: { merchant: [Afterpay, Zip Pay] }
    set: { category: buy_now_pay_later }
  - name: Transport for NSW
    when: { merchant: Transport for NSW }
    set: { category: public_transport }
