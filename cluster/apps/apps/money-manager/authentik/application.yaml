---
apiVersion: authentik.starry.blue/v1alpha1
kind: AuthentikApplication
metadata:
  name: money-manager
  namespace: default
spec:
  slug: money-manager
  name: Money Manager
  adopt: IfMatch
  deletionPolicy: Delete
  provider:
    name: Money Manager
    flows:
      authorization:
        slug: default-provider-authorization-explicit-consent
      invalidation:
        slug: default-provider-invalidation-flow
      authentication:
        slug: authentication-flow
    oauth2:
      clientType: Confidential
      redirectURIs:
        - url: https://money.${S_HOMEPROD_DOMAIN}/api/auth/callback/oidc
      scopes:
        - scopeName: openid
        - scopeName: email
        - scopeName: profile
      credentials:
        secretRef:
          name: money-manager
          clientIDKey: OIDC_CLIENT_ID
          clientSecretKey: OIDC_CLIENT_SECRET
      grantTypes:
        - AuthorizationCode
        - RefreshToken
      accessTokenValidity: minutes=5
      signingKey:
        name: authentik Self-signed Certificate
  access:
    public: true
    prune: true
