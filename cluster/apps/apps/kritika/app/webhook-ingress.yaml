# Same Funnel pattern as the Flux and Konflate webhook ingresses.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kritika-webhook
  namespace: kritika
  annotations:
    tailscale.com/funnel: "true"
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /hooks/github
            pathType: Exact
            backend:
              service:
                name: kritika
                port:
                  number: 8080
