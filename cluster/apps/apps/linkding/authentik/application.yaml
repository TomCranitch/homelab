---
apiVersion: authentik.starry.blue/v1alpha1
kind: AuthentikApplication
metadata:
  name: linkding
  namespace: default
spec:
  slug: linkding
  name: Linkding
  adopt: IfMatch
  deletionPolicy: Delete
  provider:
    name: Linkding
    flows:
      authorization:
        slug: default-provider-authorization-explicit-consent
      invalidation:
        slug: default-provider-invalidation-flow
      authentication:
        slug: authentication-flow
    proxy:
      forwardAuthSingle:
        externalHost: https://bookmarks.${S_HOMEPROD_DOMAIN}
      accessTokenValidity: hours=24
  access:
    public: true
    prune: true
