# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
  namespace: default
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
      interval: 15m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    defaultPodOptions:
      runtimeClassName: gvisor
      labels:
        networking.home.arpa/ingress-envoy: "true"
        networking.home.arpa/postgres-default-client: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: ${CONTAINER_UID}
        runAsGroup: ${CONTAINER_GID}
        fsGroup: ${CONTAINER_FSGROUP}
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      vaultwarden:
        defaultContainerOptions:
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        containers:
          app:
            image:
              repository: docker.io/vaultwarden/server
              tag: 1.37.3
            ports:
              - name: http
                containerPort: 80
                protocol: TCP
            env:
              TZ: ${TZ}
              DOMAIN: https://passwords.${S_HOMEPROD_DOMAIN}
              ADMIN_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: vaultwarden
                    key: ADMIN_TOKEN
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: default-cluster-pguser-vaultwarden
                    key: uri
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
    service:
      app:
        controller: vaultwarden
        ports:
          http:
            port: 80
    route:
      main:
        enabled: true
        kind: HTTPRoute
        hostnames:
          - "passwords.${S_HOMEPROD_DOMAIN}"
        parentRefs:
          - name: envoy-gateway
            namespace: ingress
    networkpolicies:
      app:
        type: cilium
        controller: vaultwarden
        description: Allow only the app-specific external HTTP and HTTPS traffic
        egress:
          - toEntities:
              - world
            toPorts:
              - ports:
                  - port: "80"
                    protocol: TCP
                  - port: "443"
                    protocol: TCP
        enableDefaultDeny:
          ingress: true
          egress: true
        log: vaultwarden
    persistence:
      data:
        # Avoid a name change with the app-template v2->v4 migration.
        suffix: data
        enabled: true
        type: persistentVolumeClaim
        size: 1Gi
        accessMode: ReadWriteOnce
