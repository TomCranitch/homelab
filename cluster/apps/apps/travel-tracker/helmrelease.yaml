# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: travel-tracker
  namespace: default
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
      interval: 15m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    defaultPodOptions:
      runtimeClassName: gvisor
      labels:
        networking.home.arpa/egress-kube-dns: "true"
        networking.home.arpa/ingress-envoy: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: ${CONTAINER_UID}
        runAsGroup: ${CONTAINER_GID}
        fsGroup: ${CONTAINER_FSGROUP}
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-secret
    controllers:
      "travel-tracker":
        defaultContainerOptions:
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        containers:
          app:
            image:
              repository: ghcr.io/tomcranitch/travel-tracker
              tag: latest  # TODO
            ports:
              - name: http
                containerPort: 8080
                protocol: TCP
            env:
              STADIA_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: travel-tracker
                    key: STADIA_API_KEY
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
    service:
      app:
        controller: "travel-tracker"
        ports:
          http:
            port: 8080
    route:
      main:
        enabled: true
        kind: HTTPRoute
        hostnames:
          - "travel-tracker.${S_HOMEPROD_DOMAIN}"
        parentRefs:
          - name: envoy-gateway
            namespace: ingress
    networkpolicies:
      app:
        type: cilium
        controller: travel-tracker
        description: Allow only the app-specific HTTPS map-provider traffic
        egress:
          - toEntities:
              - world
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
        enableDefaultDeny:
          ingress: true
          egress: true
        log: travel-tracker
