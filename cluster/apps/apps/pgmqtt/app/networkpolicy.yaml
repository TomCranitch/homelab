---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: pgmqtt
  namespace: default
spec:
  description: Allow MQTT clients and Kubernetes API; pod labels grant database and metrics access
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: pgmqtt
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: home-assistant
        - matchLabels:
            app.kubernetes.io/instance: zigbee2mqtt
      toPorts:
        - ports:
            - port: "1883"
              protocol: TCP
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
  enableDefaultDeny:
    ingress: true
    egress: true
  log:
    value: pgmqtt
