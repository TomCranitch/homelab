---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pgmqtt
  namespace: default
spec:
  interval: 15m
  chart:
    spec:
      chart: pgmqtt
      version: 0.1.18
      sourceRef:
        kind: HelmRepository
        name: pgmqtt-charts
        namespace: flux-system
      interval: 15m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    podLabels:
      networking.home.arpa/postgres-default-client: "true"
      networking.home.arpa/metrics: "true"
    replicaCount: 2
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: pgmqtt
                app.kubernetes.io/instance: pgmqtt
                app.kubernetes.io/component: broker
    database:
      existingSecret: default-cluster-pguser-pgmqtt
      existingSecretKey: uri
    auth:
      allowAnonymous: false
    serviceMonitor:
      enabled: true
    metrics:
      enabled: true
    logging:
      format: text
  # The chart fixes maxUnavailable at zero; allow upgrades on two eligible hosts.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: pgmqtt
            patch: |-
              - op: replace
                path: /spec/strategy/rollingUpdate/maxSurge
                value: 0
              - op: replace
                path: /spec/strategy/rollingUpdate/maxUnavailable
                value: 1
