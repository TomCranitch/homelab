---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pgmqtt
  namespace: default
spec:
  interval: 15m
  chart:
    spec:
      chart: pgmqtt
      version: 0.1.18
      sourceRef:
        kind: HelmRepository
        name: pgmqtt-charts
        namespace: flux-system
      interval: 15m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    podLabels:
      networking.home.arpa/postgres-default-client: "true"
      networking.home.arpa/metrics: "true"
    replicaCount: 2
    topologySpreadConstraints:
      - maxSkew: 1
        minDomains: 2
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        nodeTaintsPolicy: Honor
        matchLabelKeys:
          - pod-template-hash
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: pgmqtt
            app.kubernetes.io/instance: pgmqtt
            app.kubernetes.io/component: broker
    database:
      existingSecret: default-cluster-pguser-pgmqtt
      existingSecretKey: uri
    auth:
      allowAnonymous: false
    serviceMonitor:
      enabled: true
    metrics:
      enabled: true
    logging:
      format: text
