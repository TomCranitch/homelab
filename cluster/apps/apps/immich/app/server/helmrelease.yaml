# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich-server
  namespace: default
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
      interval: 15m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    defaultPodOptions:
      labels:
        networking.home.arpa/ingress-envoy: "true"
        networking.home.arpa/egress-sso: "true"
      # TODO: setup gvisor. currently erroring.
      securityContext:
        runAsNonRoot: true
        runAsUser: ${CONTAINER_UID}
        runAsGroup: ${CONTAINER_GID}
        fsGroup: ${CONTAINER_FSGROUP}
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      "immich-server":
        defaultContainerOptions:
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.3.3
            ports:
              - name: http
                containerPort: 2283
                protocol: TCP
            env:
              - name: CNPG_DATABASE_URL
                valueFrom:
                  secretKeyRef:
                    name: ${POSTGRES_IMMICH_SECRET_PREFIX}-immich
                    key: uri
              - name: DB_URL
                value: "$(CNPG_DATABASE_URL)&uselibpqcompat=true"
            envFrom:
              - secretRef:
                  name: immich
              - configMapRef:
                  name: immich
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
    service:
      app:
        controller: "immich-server"
        ports:
          http:
            port: 2283
    route:
      main:
        enabled: true
        kind: HTTPRoute
        hostnames:
          - "photos.${S_HOMEPROD_DOMAIN}"
        parentRefs:
          - name: envoy-gateway
            namespace: ingress
    networkpolicies:
      app:
        type: cilium
        controller: immich-server
        description: Default-deny Immich server with database, Valkey, ML and version-check egress
        egress:
          - toEndpoints:
              - matchLabels:
                  cnpg.io/cluster: postgres
            toPorts:
              - ports:
                  - port: "5432"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  app.kubernetes.io/instance: immich-valkey
            toPorts:
              - ports:
                  - port: "6379"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  app.kubernetes.io/instance: immich-machine-learning
            toPorts:
              - ports:
                  - port: "3003"
                    protocol: TCP
          # The server checks this endpoint for available releases.
          # OIDC uses the shared egress-sso policy; model downloads belong to ML.
          - toFQDNs:
              - matchName: version.immich.cloud
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
        enableDefaultDeny:
          ingress: true
          egress: true
        log: immich-server
    persistence:
      data:
        enabled: true
        existingClaim: immich-nfs-pvc
        globalMounts:
          - path: /usr/src/app/upload
