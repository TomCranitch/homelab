---
apiVersion: authentik.starry.blue/v1alpha1
kind: AuthentikApplication
metadata:
  name: home-assistant
  namespace: default
spec:
  slug: home-assistant
  name: Home Assistant
  adopt: IfMatch
  deletionPolicy: Delete
  provider:
    name: Home Assistant
    flows:
      authorization:
        slug: default-provider-authorization-explicit-consent
      invalidation:
        slug: default-provider-invalidation-flow
    proxy:
      forwardAuthSingle:
        externalHost: https://home.${S_HOMEPROD_DOMAIN}
      accessTokenValidity: hours=24
  access:
    public: true
    prune: true
