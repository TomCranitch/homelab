# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ntfy
  namespace: default
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
      interval: 15m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    defaultPodOptions:
      runtimeClassName: gvisor
      labels:
        networking.home.arpa/ingress-envoy: "true"
        networking.home.arpa/metrics: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: ${CONTAINER_UID}
        runAsGroup: ${CONTAINER_GID}
        fsGroup: ${CONTAINER_FSGROUP}
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      ntfy:
        defaultContainerOptions:
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        containers:
          app:
            image:
              repository: docker.io/binwiederhier/ntfy
              tag: v2.28.0
            ports:
              - name: http
                containerPort: 80
                protocol: TCP
              - name: metrics
                containerPort: 9090
                protocol: TCP
            env:
              TZ: ${TIMEZONE}
              NTFY_DEBUG: false
              NTFY_BASE_URL: https://notifications.${S_HOMEPROD_DOMAIN}
              # TODO: change port
              NTFY_METRICS_LISTEN_HTTP: :9090
            args:
              - serve
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
    service:
      app:
        controller: ntfy
        ports:
          http:
            port: 80
          metrics:
            port: 9090
    route:
      main:
        enabled: true
        kind: HTTPRoute
        hostnames:
          - "notifications.${S_HOMEPROD_DOMAIN}"
        parentRefs:
          - name: envoy-gateway
            namespace: ingress
    networkpolicies:
      app:
        type: cilium
        controller: ntfy
        description: Allow only the app-specific HTTPS push traffic
        egress:
          - toEntities:
              - world
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
        enableDefaultDeny:
          ingress: true
          egress: true
        log: ntfy
    persistence:
      cache:
        enabled: true
        type: persistentVolumeClaim
        size: 1Gi
        accessMode: ReadWriteOnce
        globalMounts:
          - path: /var/cache/ntfy
