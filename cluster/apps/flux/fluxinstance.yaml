---
# Keep the operator-managed Flux instance in Git without pruning it if the
# parent apps Kustomization is reorganized.
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  distribution:
    version: 2.7.5
    registry: ghcr.io/fluxcd
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
  cluster:
    type: kubernetes
    multitenant: false
    networkPolicy: true
    domain: cluster.local
  sync:
    kind: GitRepository
    url: https://github.com/TomCranitch/homelab.git
    ref: refs/heads/main
    path: cluster
    pullSecret: flux-system
  kustomize:
    patches:
      - target:
          kind: Kustomization
        patch: |
          - op: add
            path: /spec/decryption
            value:
              provider: sops
              secretRef:
                name: sops-age
      - target:
          kind: Kustomization
          name: flux-system
        patch: |
          apiVersion: kustomize.toolkit.fluxcd.io/v1
          kind: Kustomization
          metadata:
            name: flux-system
            namespace: flux-system
          spec:
            # Keep bootstrap orchestration non-pruning. Child Kustomizations
            # retain their own explicit pruning policies.
            prune: false
            postBuild:
              substituteFrom:
                - kind: ConfigMap
                  name: cluster-settings
                - kind: Secret
                  name: cluster-secrets
