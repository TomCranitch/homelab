---
apiVersion: v1
kind: ConfigMap
metadata:
  name: default-cluster-pgbackrest-recovery
  namespace: default
data:
  archive-recovery.conf: |
    [global:archive-get]
    # Prefer the local NFS-backed archive for routine standby recovery.
    # Once local archived WAL is exhausted, let PostgreSQL fall through
    # to streaming replication rather than chasing the remote B2 archive.
    repo=2
    archive-missing-retry=n
