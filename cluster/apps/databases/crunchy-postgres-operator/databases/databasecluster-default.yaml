---
apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: default-cluster
  namespace: default
  labels:
    crunchy-userinit.ramblurr.github.com/enabled: "true"
    crunchy-userinit.ramblurr.github.com/superuser: "postgres"
spec:
  postgresVersion: 16
  instances:
    - name: postgres
      replicas: 3
      dataVolumeClaimSpec:
        storageClassName: ceph-block
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 35Gi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: "kubernetes.io/hostname"
          whenUnsatisfiable: "DoNotSchedule"
          labelSelector:
            matchLabels:
              postgres-operator.crunchydata.com/data: postgres
              postgres-operator.crunchydata.com/cluster: default-cluster
  patroni:
    dynamicConfiguration:
      member_slots_ttl: 12h
      synchronous_mode: true
      synchronous_mode_strict: false
      postgresql:
        synchronous_commit: "on"
        use_slots: true
        parameters:
          max_slot_wal_keep_size: 4GB
          wal_keep_size: 1GB
  users:
    - name: postgres
      databases:
        - postgres
      password:
        type: AlphaNumeric
    - name: authentik
      databases:
        - authentik
      password:
        type: AlphaNumeric
    - name: linkding
      databases:
        - linkding
      password:
        type: AlphaNumeric
    - name: mealie
      databases:
        - mealie
      password:
        type: AlphaNumeric
    - name: vaultwarden
      databases:
        - vaultwarden
      password:
        type: AlphaNumeric
    - name: windmill
      databases:
        - windmill
      password:
        type: AlphaNumeric
    - name: pgmqtt
      databases:
        - pgmqtt
      password:
        type: AlphaNumeric
  backups:
    pgbackrest:
      configuration:
        - secret:
            name: crunchy-backup-secret
        - configMap:
            name: default-cluster-pgbackrest-recovery
      repos:
        - name: repo1
          s3: &brrepos3
            bucket: homeprod-crunchy
            endpoint: https://s3.us-east-005.backblazeb2.com
            region: us-east-005
          schedules:
            full: "15 3 * * 2"
            differential: "15 4 * * *"
            incremental: "0 * * * *"
        - name: repo2
          volume:
            volumeClaimSpec:
              storageClassName: nfs-client
              accessModes:
                - ReadWriteMany
              resources:
                requests:
                  storage: 100Gi
          schedules:
            full: "30 5 * * 0"
            differential: "30 5 * * 1-6"
      global:
        repo1-retention-diff: "10"
        repo1-retention-full: "120"
        repo1-retention-full-type: time
        repo1-path: /default/
        # Keep the local NFS repository as a short-lived recovery cache.
        repo2-retention-archive: "3"
        repo2-retention-archive-type: diff
        repo2-retention-diff: "7"
        repo2-retention-full: "2"
        # TODO: repo1-bundle=y
      manual:
        repoName: repo1
        options:
          - --type=full
  dataSource:
    pgbackrest:
      stanza: db
      # Disaster recovery remains pinned to the durable B2 repository.
      configuration:
        - secret:
            name: crunchy-backup-secret
      global:
        repo1-retention-diff: "10"
        repo1-retention-full: "120"
        repo1-retention-full-type: time
        repo1-path: /default/
        archive-timeout: "300"
      repo:
        name: repo1
        s3: *brrepos3
      options:
        - --log-level-console=detail

  # TODO: datasource
  # TODO: proxy.pgBouncer
