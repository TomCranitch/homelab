---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pgdump-backup
  namespace: default
spec:
  interval: 15m
  chart:
    spec:
      chart: raw
      version: v0.3.2
      sourceRef:
        kind: HelmRepository
        name: dysnix-charts
        namespace: flux-system
      interval: 15m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    resources:
      - apiVersion: batch/v1
        kind: CronJob
        metadata:
          name: postgres-dump
        spec:
          # During staging dump both PGO sources; after cutover dump CNPG once.
          schedule: "0 1 * * *"
          concurrencyPolicy: Forbid
          jobTemplate:
            spec:
              backoffLimit: 0
              template:
                metadata:
                  labels:
                    app.kubernetes.io/name: postgres-dump
                spec:
                  runtimeClassName: gvisor
                  containers:
                    - name: dump
                      image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
                      volumeMounts:
                        - name: data
                          mountPath: /backup
                      command: ["/bin/sh", "-ec"]
                      args:
                        - |
                          pg_dumpall --no-password --dbname="$DATABASE_URL" -f /backup/postgres.pgdump.tmp
                          mv /backup/postgres.pgdump.tmp /backup/postgres.pgdump
                          if [ "$DATABASE_URL" != "$IMMICH_DATABASE_URL" ]; then
                            PGPASSWORD="$IMMICH_PASSWORD" pg_dumpall --no-password --dbname="$IMMICH_DATABASE_URL" -f /backup/postgres-immich.pgdump.tmp
                            mv /backup/postgres-immich.pgdump.tmp /backup/postgres-immich.pgdump
                          fi
                      env:
                        - name: DATABASE_URL
                          valueFrom:
                            secretKeyRef:
                              name: ${POSTGRES_DUMP_SECRET}
                              key: uri
                        - name: PGPASSWORD
                          valueFrom:
                            secretKeyRef:
                              name: ${POSTGRES_DUMP_SECRET}
                              key: password
                        - name: IMMICH_DATABASE_URL
                          valueFrom:
                            secretKeyRef:
                              name: ${POSTGRES_IMMICH_DUMP_SECRET}
                              key: uri
                        - name: IMMICH_PASSWORD
                          valueFrom:
                            secretKeyRef:
                              name: ${POSTGRES_IMMICH_DUMP_SECRET}
                              key: password
                  restartPolicy: Never
                  volumes:
                    - name: data
                      persistentVolumeClaim:
                        claimName: pgdump
