---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pgdump-backup
  namespace: default
spec:
  interval: 15m
  chart:
    spec:
      chart: raw
      version: v0.3.2
      sourceRef:
        kind: HelmRepository
        name: dysnix-charts
        namespace: flux-system
      interval: 15m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    resources:
      - apiVersion: batch/v1
        kind: CronJob
        metadata:
          name: postgres-dump
        spec:
          schedule: "0 1 * * *"
          concurrencyPolicy: Forbid
          jobTemplate:
            spec:
              backoffLimit: 0
              template:
                metadata:
                  labels:
                    app.kubernetes.io/name: postgres-dump
                spec:
                  runtimeClassName: gvisor
                  containers:
                    - name: dump
                      image: postgres:18.6-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
                      volumeMounts:
                        - name: data
                          mountPath: /backup
                      command: ["/bin/sh", "-ec"]
                      args:
                        - |
                          pg_dumpall --no-password --dbname="$DATABASE_URL" -f /backup/postgres.pgdump.tmp
                          mv /backup/postgres.pgdump.tmp /backup/postgres.pgdump
                      env:
                        - name: DATABASE_URL
                          valueFrom:
                            secretKeyRef:
                              name: ${POSTGRES_DUMP_SECRET}
                              key: uri
                        - name: PGPASSWORD
                          valueFrom:
                            secretKeyRef:
                              name: ${POSTGRES_DUMP_SECRET}
                              key: password
                  restartPolicy: Never
                  volumes:
                    - name: data
                      persistentVolumeClaim:
                        claimName: pgdump
