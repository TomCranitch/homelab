---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: postgres-dump
  namespace: default
spec:
  description: Allow dumps to reach the shared PostgreSQL cluster
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: postgres-dump
  egress:
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: postgres
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
  enableDefaultDeny:
    ingress: true
    egress: true
  log:
    value: postgres-dump
