---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: postgres-dump
  namespace: default
spec:
  description: Allow dumps to reach PGO during migration and the consolidated CNPG cluster
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: postgres-dump
  egress:
    - toEndpoints:
        - matchLabels:
            postgres-operator.crunchydata.com/cluster: default-cluster
        - matchLabels:
            postgres-operator.crunchydata.com/cluster: immich-cluster
        - matchLabels:
            cnpg.io/cluster: postgres
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
  enableDefaultDeny:
    ingress: true
    egress: true
  log:
    value: postgres-dump
