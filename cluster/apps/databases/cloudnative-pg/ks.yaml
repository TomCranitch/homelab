apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg
  namespace: flux-system
spec:
  targetNamespace: database
  path: ./cluster/apps/databases/cloudnative-pg/operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: barman-cloud
  namespace: flux-system
spec:
  targetNamespace: database
  dependsOn:
    - name: cloudnative-pg
  path: ./cluster/apps/databases/cloudnative-pg/plugin
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: postgres-credentials
  namespace: flux-system
spec:
  targetNamespace: default
  path: ./cluster/apps/databases/cloudnative-pg/credentials
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 30m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: postgres-cluster
  namespace: flux-system
spec:
  targetNamespace: default
  suspend: ${CNPG_CLUSTER_SUSPENDED}
  dependsOn:
    - name: cloudnative-pg
    - name: barman-cloud
    - name: postgres-credentials
  path: ./cluster/apps/databases/cloudnative-pg/cluster
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 60m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Database
      current: has(status.applied) && status.applied && status.observedGeneration == metadata.generation
    - apiVersion: postgresql.cnpg.io/v1
      kind: DatabaseRole
      current: has(status.applied) && status.applied && status.observedGeneration == metadata.generation
