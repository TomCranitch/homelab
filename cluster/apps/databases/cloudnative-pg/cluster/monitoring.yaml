apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: postgres
  namespace: default
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: postgres
  podMetricsEndpoints:
    - port: metrics
      relabelConfigs:
        - sourceLabels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
          targetLabel: cluster
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: postgres
  namespace: default
spec:
  groups:
    - name: postgres-backups
      rules:
        - alert: PostgresWALArchivingFailing
          expr: increase(cnpg_pg_stat_archiver_failed_count{namespace="default",cluster="postgres"}[15m]) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: PostgreSQL WAL uploads to B2 are failing
        - alert: PostgresBaseBackupStale
          expr: (time() - cnpg_collector_last_available_backup_timestamp{namespace="default",cluster="postgres"} > 8 * 24 * 3600) or absent(cnpg_collector_last_available_backup_timestamp{namespace="default",cluster="postgres"})
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: PostgreSQL has no recent physical base backup
