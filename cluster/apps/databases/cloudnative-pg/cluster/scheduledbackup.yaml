apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-weekly
  namespace: default
spec:
  # Six fields: seconds, minutes, hours, day, month, weekday; UTC.
  schedule: "0 15 3 * * 2"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
