apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: postgres-windmill-admin
  namespace: default
spec:
  name: windmill_admin
  cluster:
    name: postgres
  login: false
  bypassrls: true
  databaseRoleReclaimPolicy: retain
  createdb: false
  createrole: false
  replication: false
  inherit: true
  connectionLimit: -1
  inRoles:
    - windmill_user
---
