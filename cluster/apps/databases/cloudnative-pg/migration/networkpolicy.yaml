apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: postgres-migration
  namespace: default
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: postgres-migration
  egress:
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: postgres
        - matchLabels:
            postgres-operator.crunchydata.com/cluster: immich-cluster
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
  enableDefaultDeny:
    ingress: true
    egress: true
