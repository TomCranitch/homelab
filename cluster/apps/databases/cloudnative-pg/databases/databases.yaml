apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: postgres-immich
  namespace: default
spec:
  name: immich
  owner: immich
  databaseReclaimPolicy: retain
  cluster:
    name: postgres
  extensions:
    - name: vector
      version: "0.8.2"
      ensure: present
    - name: vchord
      version: "1.1.1"
      ensure: present
    - name: cube
      ensure: present
    - name: earthdistance
      ensure: present
---
