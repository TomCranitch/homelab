---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reader-lowpriv
  namespace: default
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: reader-lowpriv
rules:
  # Pod logs are intentionally readable cluster-wide.
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: reader-lowpriv
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: reader-lowpriv
subjects:
  - kind: ServiceAccount
    name: reader-lowpriv
    namespace: default
