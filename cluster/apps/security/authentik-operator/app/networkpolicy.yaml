---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authentik-operator
  namespace: default
spec:
  description: Allow Kubernetes and Authentik API access and node health probes only
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: authentik-operator
      app.kubernetes.io/instance: authentik-operator
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: default
            app.kubernetes.io/instance: authentik
            app.kubernetes.io/component: server
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
  enableDefaultDeny:
    ingress: true
    egress: true
  log:
    value: authentik-operator
