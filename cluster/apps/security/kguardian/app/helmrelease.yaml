---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kguardian
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kguardian
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    namespace:
      name: kguardian

    telemetry:
      enabled: false

    controller:
      excludedNamespaces:
        - kguardian
        - kube-system

    syscalls:
      captureLevel: full

    # Capture syscall activity and kernel seccomp verdicts only. Profiles are
    # not written to nodes or attached to workloads until explicitly enabled.
    seccomp:
      distribute: false
      installCRDs: true
      denials:
        enabled: true
        intervalSeconds: 10

    # Collect cgroup usage, pressure, throttling, and reclaim signals. Keep the
    # scheduler eBPF contention probe off until its node overhead is measured.
    compute:
      enabled: true
      contention:
        enabled: false

    broker:
      resources:
        limits:
          memory: 2Gi
        requests:
          cpu: 100m
          memory: 256Mi
      metrics:
        serviceMonitor:
          enabled: true
        prometheusRule:
          enabled: true

    database:
      enabled: true
      persistence:
        enabled: true
        size: 30Gi
        storageClassName: ceph-block
      resources:
        limits:
          memory: 2Gi
        requests:
          cpu: 100m
          memory: 512Mi

    frontend:
      ingress:
        enabled: false

    # The bridge hosts /mcp. It does not need an LLM provider because the MCP
    # client supplies the model and the tools query the broker directly.
    ai:
      enabled: true
      mcp:
        enabled: true
        auth:
          existingSecret: kguardian-mcp-token
          secretKey: token

    llmBridge:
      replicaCount: 1

    evaluator:
      enabled: true
