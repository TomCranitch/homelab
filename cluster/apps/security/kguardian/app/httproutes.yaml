---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kguardian-ui
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: ingress
      sectionName: https
  hostnames:
    - "kguardian.${S_HOMEPROD_DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kguardian-frontend
          port: 5173
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kguardian-mcp
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: ingress
      sectionName: https
  hostnames:
    - "kguardian-mcp.${S_HOMEPROD_DOMAIN}"
  rules:
    - matches:
        - path:
            type: Exact
            value: /mcp
      backendRefs:
        - name: kguardian-llm-bridge
          port: 8080
