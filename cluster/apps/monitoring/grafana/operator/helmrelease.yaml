---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-operator
  namespace: monitoring
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: grafana-operator
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    # Use cluster-wide RBAC if we need cross-namespace CR watching
    rbac:
      create: true
      useClusterRole: true
