---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 15m
  chart:
    spec:
      chart: cilium
      version: 1.20.2
      sourceRef:
        kind: HelmRepository
        name: cilium-charts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    # Roll agents when rendered Cilium config changes so datapath settings do
    # not remain stale until the DaemonSet is restarted manually.
    rollOutCiliumPods: true

    cluster:
      name: "homeprod"
      id: 1
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE

    # Talos already mounts cgroup v2 on the host; reuse it instead of having
    # Cilium manage a separate cgroup mount.
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup

    kubeProxyReplacement: true
    # Keep socket-level service translation in the host namespace so gVisor/Kata
    # workloads use Cilium's tc datapath for Kubernetes Service handling.
    socketLB:
      enabled: true
      hostNamespaceOnly: true
    kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256
    k8sServiceHost: cranitch.k8s
    k8sServicePort: 6443
    # ipv4NativeRoutingCIDR: 10.10.0.0/116
    ipam:
      mode: "kubernetes"
    hubble:
      enabled: true
      relay:
        enabled: true
      metrics:
        enabled:
          - dns:query
          - drop
          - tcp
          - flow
          - port-distribution
          - icmp
          - http
        serviceMonitor:
          enabled: true
        dashboards:
          enabled: true
          annotations:
            grafana_folder: cilium
      ui:
        enabled: true
        rollOutPods: true
        ingress:
          enabled: false
    ipv6:
      enabled: false
    bgpControlPlane:
      enabled: true
    l7Proxy: true
    cni:
      exclusive: false
    operator:
      rollOutPods: true
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
      dashboards:
        enabled: true
        annotations:
          grafana_folder: cilium
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        trustCRDsExist: true
    dashboards:
      enabled: true
      annotations:
        grafana_folder: cilium
    envoy:
      enabled: false
