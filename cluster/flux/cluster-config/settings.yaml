---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-settings
  namespace: flux-system
data:
  SSO_DOMAIN_PREFIX: sso
  TZ: Australia/Sydney

  CNPG_CLUSTER_SUSPENDED: "false"
  CNPG_DATABASE_APPLY_POLICY: Override
  POSTGRES_DEFAULT_SECRET_PREFIX: postgres
  POSTGRES_IMMICH_SECRET_PREFIX: postgres
  POSTGRES_DUMP_SECRET: postgres-admin
  POSTGRES_IMMICH_DUMP_SECRET: postgres-admin

  CONTAINER_UID: "987"
  CONTAINER_GID: "999"
  CONTAINER_FSGROUP: "1999"
