---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-settings
  namespace: flux-system
data:
  SSO_DOMAIN_PREFIX: sso
  TZ: Australia/Sydney

  # Migration gates: stage.py enables these only after credentials/rehearsal.
  CNPG_CLUSTER_SUSPENDED: "true"
  CNPG_DATABASES_SUSPENDED: "true"
  POSTGRES_DEFAULT_SECRET_PREFIX: default-cluster-pguser
  POSTGRES_IMMICH_SECRET_PREFIX: immich-cluster-pguser
  POSTGRES_DUMP_SECRET: default-cluster-pguser-postgres
  POSTGRES_IMMICH_DUMP_SECRET: immich-cluster-pguser-postgres

  CONTAINER_UID: "987"
  CONTAINER_GID: "999"
  CONTAINER_FSGROUP: "1999"
