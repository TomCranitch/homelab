---
cluster:
  name: "homeprod"
  id: 1

securityContext:
  privileged: true

kubeProxyReplacement: true
kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256
# Match the Flux-managed configuration: use Talos's node-local API load balancer.
k8sServiceHost: localhost
k8sServicePort: 7445

# Match the Flux-managed agent rollout strategy.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1

# ipv4NativeRoutingCIDR: 10.10.0.0/116

ipam:
  mode: "kubernetes"

hubble:
  enabled: false

envoy:
  enabled: false

ipv6:
  enabled: false

bgp:
  enabled: false
#  announce:
#    loadbalancerIP: true
